<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <!-- Application Bundle -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // API Helper
    const API = {
      getToken: () => localStorage.getItem('rebuild_token'),
      setToken: (t) => localStorage.setItem('rebuild_token', t),
      clearToken: () => localStorage.removeItem('rebuild_token'),

      async req(endpoint, opts = {}) {
        const headers = { ...(opts.headers || {}) };
        const token = this.getToken();
        if (token) headers['Authorization'] = `Bearer ${token}`;

        if (opts.body && !(opts.body instanceof FormData)) {
          headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(opts.body);
        }

        const res = await fetch(endpoint, { ...opts, headers });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || 'Request failed');
        }
        return res.json();
      }
    };

    // ==========================================
    // Real Camera Modal Component
    // ==========================================
    function CameraModal({ isOpen, onClose, onCapture }) {
      const [stream, setStream] = useState(null);
      const [photo, setPhoto] = useState(null);
      const [error, setError] = useState(null);
      const [facingMode, setFacingMode] = useState('environment');
      const videoRef = useRef(null);
      const canvasRef = useRef(null);

      useEffect(() => {
        if (isOpen && !photo) {
          startCam();
        } else {
          stopCam();
        }
        return () => stopCam();
      }, [isOpen, facingMode]);

      const startCam = async () => {
        stopCam();
        setError(null);
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setError('Camera API is not supported in this browser. Please use file upload.');
          return;
        }
        try {
          const s = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          setStream(s);
          if (videoRef.current) videoRef.current.srcObject = s;
        } catch (err) {
          console.error('Camera error:', err);
          if (err.name === 'NotAllowedError') setError('Camera permission was denied. Please allow camera permissions or upload an image.');
          else if (err.name === 'NotFoundError') setError('No camera found on this device.');
          else setError('Unable to access camera: ' + err.message);
        }
      };

      const stopCam = () => {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          setStream(null);
        }
        if (videoRef.current) videoRef.current.srcObject = null;
      };

      const takeSnapshot = () => {
        const v = videoRef.current;
        const c = canvasRef.current;
        if (!v || !c) return;
        c.width = v.videoWidth || 640;
        c.height = v.videoHeight || 480;
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        const dataUrl = c.toDataURL('image/jpeg', 0.92);
        setPhoto(dataUrl);
        stopCam();
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm fade-in">
          <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl">
            <div className="px-6 py-4 border-b flex justify-between items-center">
              <span className="font-bold text-gray-900 text-base">Device Camera Capture</span>
              <button onClick={() => { stopCam(); setPhoto(null); onClose(); }} className="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
            </div>

            <div className="relative bg-black min-h-[300px] max-h-[420px] flex items-center justify-center overflow-hidden">
              {error ? (
                <div className="p-6 text-center text-red-200">
                  <p className="text-sm font-semibold mb-3">{error}</p>
                  <button onClick={startCam} className="px-4 py-1.5 bg-white/20 hover:bg-white/30 text-white rounded-lg text-xs">Retry Camera</button>
                </div>
              ) : photo ? (
                <img src={photo} alt="Captured" className="w-full h-auto max-h-[420px] object-contain" />
              ) : (
                <>
                  <video ref={videoRef} autoPlay playsInline muted className="w-full h-auto max-h-[420px] object-contain" />
                  <div className="absolute inset-8 border-2 border-dashed border-white/40 rounded-2xl pointer-events-none flex items-center justify-center">
                    <span className="text-white/80 text-xs bg-black/50 px-3 py-1 rounded-full">Center material in viewfinder</span>
                  </div>
                  <button
                    onClick={() => setFacingMode(prev => prev === 'environment' ? 'user' : 'environment')}
                    className="absolute top-3 right-3 px-3 py-1 bg-black/60 text-white rounded-full text-xs"
                  >
                    Flip Camera
                  </button>
                </>
              )}
              <canvas ref={canvasRef} className="hidden" />
            </div>

            <div className="p-4 bg-gray-50 flex justify-between items-center">
              {photo ? (
                <>
                  <button onClick={() => { setPhoto(null); startCam(); }} className="px-4 py-2 border border-gray-300 text-gray-700 rounded-xl text-xs font-semibold hover:bg-white">
                    Retake Photo
                  </button>
                  <button onClick={() => { onCapture(photo); stopCam(); setPhoto(null); onClose(); }} className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md">
                    Use This Photo
                  </button>
                </>
              ) : (
                <>
                  <button onClick={() => { stopCam(); onClose(); }} className="px-4 py-2 text-gray-500 text-xs">Cancel</button>
                  <button onClick={takeSnapshot} disabled={!!error} className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md">
                    Capture Photo
                  </button>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // Main App Root Component
    // ==========================================
    function App() {
      const [route, setRoute] = useState(() => {
        const p = window.location.pathname.replace(/^\/+|\/+$/g, '');
        if (p === 'assessment') return 'assessment';
        if (p === 'marketplace') return 'marketplace';
        if (p === 'sell' || p === 'wizard') return 'sell';
        if (p === 'buy') return 'buy';
        if (p === 'profile') return 'profile';
        if (p === 'login') return 'login';
        if (p === 'register') return 'register';
        if (p === 'evaluation') return 'evaluation';
        return 'landing';
      });
      const [user, setUser] = useState(null);
      const [selectedListingId, setSelectedListingId] = useState(null);
      const [prefillData, setPrefillData] = useState(null);

      useEffect(() => {
        checkAuth();
        const handlePop = () => {
          const p = window.location.pathname.replace(/^\/+|\/+$/g, '');
          setRoute(p || 'landing');
        };
        window.addEventListener('popstate', handlePop);
        return () => window.removeEventListener('popstate', handlePop);
      }, []);

      const checkAuth = async () => {
        if (API.getToken()) {
          try {
            const me = await API.req('/api/auth/me');
            setUser(me);
          } catch (e) {
            API.clearToken();
            setUser(null);
          }
        }
      };

      const handleNavigate = (newRoute) => {
        setRoute(newRoute);
        const url = newRoute === 'landing' ? '/' : `/${newRoute}`;
        if (window.location.pathname !== url) {
          window.history.pushState({}, '', url);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleLogout = () => {
        API.clearToken();
        setUser(null);
        handleNavigate('landing');
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* BUILD BACK Common Navigation Bar */}
          <nav className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              {/* Brand Logo */}
              <div className="flex items-center gap-3 cursor-pointer select-none" onClick={() => handleNavigate('landing')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white text-xl font-black shadow-md shadow-emerald-600/20">
                  ♻
                </div>
                <div>
                  <span className="font-extrabold text-xl text-gray-900 tracking-tight">BUILD<span className="text-emerald-600">BACK</span></span>
                  <span className="block text-[10px] uppercase font-bold text-emerald-700 tracking-widest">AI Circular Waste Platform</span>
                </div>
              </div>

              {/* Navigation Links */}
              <div className="hidden md:flex items-center gap-1 lg:gap-2 text-sm font-semibold text-gray-700">
                <button onClick={() => handleNavigate('landing')} className={`px-3 py-1.5 rounded-lg transition ${route === 'landing' ? 'bg-emerald-50 text-emerald-700' : 'hover:bg-gray-100'}`}>
                  Home
                </button>
                <button onClick={() => handleNavigate('assessment')} className={`px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 ${route === 'assessment' ? 'bg-emerald-100 text-emerald-800 font-bold' : 'text-emerald-700 bg-emerald-50/50 hover:bg-emerald-100/60'}`}>
                  <span>✨</span> AI Assessment
                </button>
                <button onClick={() => handleNavigate('marketplace')} className={`px-3 py-1.5 rounded-lg transition ${route === 'marketplace' ? 'bg-emerald-50 text-emerald-700' : 'hover:bg-gray-100'}`}>
                  Marketplace
                </button>
                <button onClick={() => handleNavigate('sell')} className={`px-3 py-1.5 rounded-lg transition ${route === 'sell' || route === 'wizard' ? 'bg-emerald-50 text-emerald-700' : 'hover:bg-gray-100'}`}>
                  Sell
                </button>
                <button onClick={() => handleNavigate('buy')} className={`px-3 py-1.5 rounded-lg transition ${route === 'buy' ? 'bg-emerald-50 text-emerald-700' : 'hover:bg-gray-100'}`}>
                  Buy
                </button>
                <button onClick={() => handleNavigate('profile')} className={`px-3 py-1.5 rounded-lg transition ${route === 'profile' ? 'bg-emerald-50 text-emerald-700' : 'hover:bg-gray-100'}`}>
                  Profile
                </button>
                {user && user.user_type === 'ADMIN' && (
                  <button onClick={() => handleNavigate('admin')} className={`px-3 py-1.5 rounded-lg transition text-purple-700 ${route === 'admin' ? 'bg-purple-50' : 'hover:bg-purple-50'}`}>
                    Admin
                  </button>
                )}
              </div>

              {/* User / Auth Controls */}
              <div className="flex items-center gap-3">
                {user ? (
                  <div className="flex items-center gap-2.5">
                    <button onClick={() => handleNavigate('profile')} className="flex items-center gap-2 hover:bg-gray-100 px-2.5 py-1 rounded-lg transition">
                      <div className="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-800 font-bold flex items-center justify-center text-xs">
                        {user.name ? user.name.charAt(0).toUpperCase() : 'U'}
                      </div>
                      <span className="text-xs font-bold text-gray-900 hidden sm:inline">{user.name}</span>
                    </button>
                    <button onClick={handleLogout} className="px-2.5 py-1 text-xs font-semibold text-red-600 hover:bg-red-50 rounded-lg transition">Sign Out</button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <button onClick={() => handleNavigate('login')} className="px-3 py-1.5 text-xs font-bold text-gray-700 hover:bg-gray-100 rounded-lg transition">Login</button>
                    <button onClick={() => handleNavigate('register')} className="px-3.5 py-1.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-sm transition">Register</button>
                  </div>
                )}
              </div>
            </div>
          </nav>

          {/* Main Body Router */}
          <main className="flex-1">
            {route === 'landing' && <LandingView onNavigate={handleNavigate} />}
            {route === 'assessment' && (
              <AssessmentView
                onNavigate={handleNavigate}
                onStartListing={(data) => {
                  setPrefillData(data);
                  handleNavigate('sell');
                }}
              />
            )}
            {route === 'marketplace' && <MarketplaceView onSelect={(id) => { setSelectedListingId(id); handleNavigate('detail'); }} onNavigate={handleNavigate} />}
            {route === 'detail' && <DetailView id={selectedListingId} onBack={() => handleNavigate('marketplace')} onNavigate={handleNavigate} user={user} />}
            {(route === 'sell' || route === 'wizard') && <WizardView onNavigate={handleNavigate} user={user} initialData={prefillData} />}
            {route === 'buy' && <BuyerView onSelect={(id) => { setSelectedListingId(id); handleNavigate('detail'); }} onNavigate={handleNavigate} />}
            {route === 'profile' && <ProfileView user={user} onNavigate={handleNavigate} onLogout={handleLogout} onSelect={(id) => { setSelectedListingId(id); handleNavigate('detail'); }} />}
            {route === 'seller' && <SellerView onNavigate={handleNavigate} />}
            {route === 'buyer' && <BuyerView onSelect={(id) => { setSelectedListingId(id); handleNavigate('detail'); }} onNavigate={handleNavigate} />}
            {route === 'admin' && <AdminView onSelect={(id) => { setSelectedListingId(id); handleNavigate('detail'); }} />}
            {route === 'evaluation' && <EvaluationView />}
            {route === 'login' && <LoginView onNavigate={handleNavigate} onLogin={setUser} />}
            {route === 'register' && <RegisterView onNavigate={handleNavigate} onLogin={setUser} />}
          </main>

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 py-10 text-xs border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div>
                <span className="font-bold text-white text-sm">BUILD BACK</span> — AI-Powered Construction Waste Reuse & Second-Market Platform
              </div>
              <div className="flex gap-4 items-center">
                <button onClick={() => handleNavigate('assessment')} className="hover:text-white">AI Assessment</button>
                <button onClick={() => handleNavigate('marketplace')} className="hover:text-white">Marketplace</button>
                <button onClick={() => handleNavigate('evaluation')} className="hover:text-white">Model Metrics</button>
                <span>MobileNetV2 • R²=0.935 • MIT License</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }


    // ==========================================
    // 1. Landing Page View
    // ==========================================

    // ==========================================
    // 2. Marketplace View
    // ==========================================
    function MarketplaceView({ onSelect, onNavigate }) {
      const [listings, setListings] = useState([]);
      const [category, setCategory] = useState('');
      const [search, setSearch] = useState('');
      const [grade, setGrade] = useState('');
      const [cameraOpen, setCameraOpen] = useState(false);
      const [similarModalOpen, setSimilarModalOpen] = useState(false);
      const [similarResults, setSimilarResults] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        loadListings();
      }, [category, grade]);

      const loadListings = async () => {
        setLoading(true);
        try {
          const params = new URLSearchParams();
          if (category) params.append('category', category);
          if (grade) params.append('quality_grade', grade);
          if (search) params.append('search', search);
          const data = await API.req('/api/listings?' + params.toString());
          setListings(data);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const handlePhotoSearch = async (dataUrl) => {
        setSimilarModalOpen(true);
        try {
          const res = await API.req('/api/ml/image-search', {
            method: 'POST',
            body: { base64_image: dataUrl }
          });
          setSimilarResults(res);
        } catch (e) {
          alert('Similar search failed: ' + e.message);
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-6 fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h1 className="text-3xl font-extrabold text-gray-900">Materials Marketplace</h1>
              <p className="text-xs text-gray-500">Browse and trade verified salvaged construction inventory.</p>
            </div>
            <button onClick={() => setCameraOpen(true)} className="px-4 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
              📷 Visual Similarity Camera
            </button>
          </div>

          {/* Filter Bar */}
          <div className="p-4 bg-white rounded-2xl border border-gray-200 shadow-sm flex flex-wrap gap-3">
            <input
              type="text"
              placeholder="Search material..."
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && loadListings()}
              className="px-3 py-2 border rounded-xl text-xs flex-1 min-w-[200px]"
            />
            <select value={category} onChange={(e) => setCategory(e.target.value)} className="px-3 py-2 border rounded-xl text-xs bg-white">
              <option value="">All Categories</option>
              <option value="Masonry">Masonry</option>
              <option value="Metals & Structural">Metals & Structural</option>
              <option value="Aggregates & Masonry">Aggregates & Masonry</option>
              <option value="Joinery & Fixtures">Joinery & Fixtures</option>
              <option value="Finishing & Ceramics">Finishing & Ceramics</option>
            </select>
            <select value={grade} onChange={(e) => setGrade(e.target.value)} className="px-3 py-2 border rounded-xl text-xs bg-white">
              <option value="">All Grades</option>
              <option value="A">Grade A (Excellent)</option>
              <option value="B">Grade B (Good)</option>
              <option value="C">Grade C (Moderate)</option>
            </select>
            <button onClick={loadListings} className="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Filter</button>
          </div>

          {/* Grid */}
          {loading ? (
            <p className="text-center py-16 text-gray-500 text-sm">Loading materials...</p>
          ) : listings.length === 0 ? (
            <p className="text-center py-16 text-gray-500 text-sm">No listings found matching criteria.</p>
          ) : (
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {listings.map(l => (
                <div key={l.id} onClick={() => onSelect(l.id)} className="bg-white rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition overflow-hidden cursor-pointer flex flex-col justify-between group">
                  <div>
                    <img src={l.image_url} alt={l.material_name} className="w-full h-48 object-cover group-hover:scale-105 transition duration-300" />
                    <div className="p-4">
                      <div className="flex justify-between items-start mb-1">
                        <h3 className="font-bold text-gray-900 text-base">{l.material_name}</h3>
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${l.quality_grade === 'A' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}`}>
                          Grade {l.quality_grade}
                        </span>
                      </div>
                      <p className="text-xs text-gray-500 mb-2">📍 {l.city}, {l.state}</p>
                      <p className="text-xs text-gray-600 line-clamp-1">{l.original_usage}</p>
                    </div>
                  </div>
                  <div className="p-4 border-t flex justify-between items-center bg-gray-50/50">
                    <div>
                      <span className="text-lg font-black text-emerald-700">₹{l.price.toLocaleString()}</span>
                      <p className="text-[10px] text-gray-500">{l.quantity} {l.unit}</p>
                    </div>
                    <span className="text-xs font-bold text-emerald-600 hover:underline">View Details →</span>
                  </div>
                </div>
              ))}
            </div>
          )}

          <CameraModal isOpen={cameraOpen} onClose={() => setCameraOpen(false)} onCapture={handlePhotoSearch} />

          {/* Similar modal */}
          {similarModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-gray-900">Visually Similar Materials</h3>
                  <button onClick={() => setSimilarModalOpen(false)} className="text-gray-400 hover:text-gray-600">✕</button>
                </div>
                <div className="space-y-2 max-h-[60vh] overflow-y-auto">
                  {similarResults.map(r => (
                    <div key={r.id} onClick={() => { setSimilarModalOpen(false); onSelect(r.id); }} className="p-3 border rounded-xl hover:bg-emerald-50 cursor-pointer flex items-center gap-3">
                      <img src={r.image_url} className="w-14 h-14 rounded-lg object-cover" />
                      <div className="flex-1">
                        <h4 className="font-bold text-xs text-gray-900">{r.material_name}</h4>
                        <p className="text-[11px] text-gray-500">📍 {r.city} • Grade {r.quality_grade}</p>
                        <span className="text-xs font-bold text-emerald-700">₹{r.price.toLocaleString()}</span>
                      </div>
                      <span className="px-2 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">{r.similarity_score}% Match</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. Detail View & Purchase Dialog
    // ==========================================
    function DetailView({ id, onBack, onNavigate, user }) {
      const [listing, setListing] = useState(null);
      const [loading, setLoading] = useState(true);
      const [offerPrice, setOfferPrice] = useState('');
      const [offerQty, setOfferQty] = useState('');
      const [dialogOpen, setDialogOpen] = useState(false);
      const [sent, setSent] = useState(false);

      useEffect(() => {
        API.req('/api/listings/' + id).then(data => {
          setListing(data);
          setOfferPrice(data.price);
          setOfferQty(data.quantity);
          setLoading(false);
        }).catch(err => setLoading(false));
      }, [id]);

      const handleSendOffer = async (e) => {
        e.preventDefault();
        if (!user) { alert('Please log in to submit offers.'); onNavigate('login'); return; }
        try {
          await API.req('/api/purchases/request', {
            method: 'POST',
            body: {
              listing_id: id,
              quantity: parseFloat(offerQty),
              proposed_price: parseFloat(offerPrice),
              message: 'Requesting fast inspection & pickup.'
            }
          });
          setSent(true);
        } catch (e) {
          alert('Offer failed: ' + e.message);
        }
      };

      if (loading) return <p className="text-center py-20 text-gray-500">Loading details...</p>;
      if (!listing) return <p className="text-center py-20 text-red-500">Listing not found.</p>;

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 space-y-6 fade-in">
          <button onClick={onBack} className="text-xs font-bold text-gray-600 hover:text-emerald-700">← Back to Marketplace</button>
          <div className="grid md:grid-cols-2 gap-8">
            <img src={listing.image_url} alt={listing.material_name} className="w-full h-80 object-cover rounded-3xl border shadow-sm" />
            <div className="space-y-4">
              <span className="px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">Quality Grade {listing.quality_grade} ({listing.quality_score}/100)</span>
              <h1 className="text-3xl font-extrabold text-gray-900">{listing.material_name}</h1>
              <p className="text-xs text-gray-500">📍 {listing.city}, {listing.state} • Pickup: {listing.availability}</p>

              <div className="p-4 bg-gray-50 rounded-2xl border flex justify-between items-center">
                <div>
                  <span className="text-xs text-gray-500 uppercase font-semibold">Asking Price</span>
                  <div className="text-3xl font-black text-emerald-700">₹{listing.price.toLocaleString()}</div>
                </div>
                <div className="text-right">
                  <span className="text-xs text-gray-500 uppercase font-semibold">Quantity</span>
                  <div className="text-lg font-bold text-gray-900">{listing.quantity} {listing.unit}</div>
                </div>
              </div>

              <div className="p-4 bg-emerald-900 text-white rounded-2xl text-xs space-y-1">
                <span className="font-bold text-emerald-300 uppercase">Certified Circular Impact</span>
                <p>Estimated Landfill Diversion: <b>{((listing.quantity * 3) / 1000).toFixed(2)} tonnes</b></p>
                <p>Avoided Embodied Carbon: <b>{(listing.quantity * 0.72).toFixed(0)} kg CO₂e</b></p>
              </div>

              <button onClick={() => setDialogOpen(true)} className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow-md">
                Make Purchase Offer
              </button>
            </div>
          </div>

          {dialogOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                {sent ? (
                  <div className="text-center py-4">
                    <p className="font-bold text-emerald-700 text-base mb-1">Offer Submitted!</p>
                    <p className="text-xs text-gray-500 mb-4">Seller has been notified of your offer.</p>
                    <button onClick={() => { setDialogOpen(false); setSent(false); }} className="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold">Done</button>
                  </div>
                ) : (
                  <form onSubmit={handleSendOffer} className="space-y-3">
                    <h3 className="font-bold text-gray-900 text-sm">Send Purchase Offer</h3>
                    <div>
                      <label className="text-[11px] font-semibold text-gray-600 block">Proposed Price (₹)</label>
                      <input type="number" required value={offerPrice} onChange={(e) => setOfferPrice(e.target.value)} className="w-full px-3 py-1.5 border rounded-lg text-sm font-bold text-emerald-800" />
                    </div>
                    <div>
                      <label className="text-[11px] font-semibold text-gray-600 block">Quantity ({listing.unit})</label>
                      <input type="number" required value={offerQty} onChange={(e) => setOfferQty(e.target.value)} className="w-full px-3 py-1.5 border rounded-lg text-sm" />
                    </div>
                    <div className="flex justify-end gap-2 pt-2">
                      <button type="button" onClick={() => setDialogOpen(false)} className="px-3 py-1.5 border rounded-lg text-xs">Cancel</button>
                      <button type="submit" className="px-4 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold">Submit</button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3.5 Dedicated AI Assessment View (Page 1)
    // ==========================================
    function AssessmentView({ onNavigate, onStartListing }) {
      const [cameraOpen, setCameraOpen] = useState(false);
      const [photo, setPhoto] = useState(null);
      const [analyzing, setAnalyzing] = useState(false);
      const [cRes, setCRes] = useState(null);
      const [selectedMat, setSelectedMat] = useState('');
      const [age, setAge] = useState(2.0);
      const [damage, setDamage] = useState(10.0);
      const [qData, setQData] = useState(null);
      const [qty, setQty] = useState(500);
      const [unit, setUnit] = useState('Pieces');
      const [valData, setValData] = useState(null);
      const [envData, setEnvData] = useState(null);
      const [activeTab, setActiveTab] = useState('quality');
      const [errorMsg, setErrorMsg] = useState(null);

      const runAI = async (imgData) => {
        setAnalyzing(true);
        setErrorMsg(null);
        try {
          const fd = new FormData();
          fd.append('base64_image', imgData);
          const c = await API.req('/api/ml/predict-material', { method: 'POST', body: fd });
          setCRes(c);
          setSelectedMat(c.predicted_material);

          const q = await API.req('/api/ml/assess-quality', {
            method: 'POST',
            body: { material_name: c.predicted_material, age_years: age, damage_percentage: damage, original_usage: 'Demolition Salvage' }
          });
          setQData(q);

          const p = await API.req('/api/ml/predict-price', {
            method: 'POST',
            body: { material_name: c.predicted_material, quantity: qty, unit: unit, quality_score: q.quality_score, age_years: age, damage_percentage: damage, city: 'Bangalore' }
          });
          setValData(p);

          try {
            const env = await API.req('/api/environmental/calculate', {
              method: 'POST',
              body: { material_name: c.predicted_material, quantity: qty, unit: unit }
            });
            setEnvData(env);
          } catch(e) {}
        } catch(err) {
          setErrorMsg(err.message || 'AI diagnostics failed. You can adjust parameters manually.');
        } finally {
          setAnalyzing(false);
        }
      };

      const handleUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setPhoto(ev.target.result);
          runAI(ev.target.result);
        };
        reader.readAsDataURL(file);
      };

      const handleRecalc = async () => {
        if (!selectedMat) return;
        setAnalyzing(true);
        try {
          const q = await API.req('/api/ml/assess-quality', {
            method: 'POST',
            body: { material_name: selectedMat, age_years: age, damage_percentage: damage, original_usage: 'Demolition Salvage' }
          });
          setQData(q);

          const p = await API.req('/api/ml/predict-price', {
            method: 'POST',
            body: { material_name: selectedMat, quantity: qty, unit: unit, quality_score: q.quality_score, age_years: age, damage_percentage: damage, city: 'Bangalore' }
          });
          setValData(p);

          const env = await API.req('/api/environmental/calculate', {
            method: 'POST',
            body: { material_name: selectedMat, quantity: qty, unit: unit }
          });
          setEnvData(env);
        } catch(e) {}
        finally { setAnalyzing(false); }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 fade-in space-y-8">
          {/* Header Banner */}
          <div className="bg-gradient-to-r from-emerald-800 to-teal-900 rounded-3xl p-6 sm:p-8 text-white shadow-xl">
            <span className="inline-block px-3 py-1 bg-emerald-500/20 text-emerald-300 text-xs font-semibold rounded-full mb-3 border border-emerald-400/20">
              MobileNetV2 + Gradient Boosting + Circular LCA
            </span>
            <h1 className="text-2xl sm:text-4xl font-extrabold tracking-tight mb-2">
              AI Construction Material Assessment
            </h1>
            <p className="text-xs sm:text-sm text-emerald-100/90 max-w-2xl">
              Capture or upload salvaged materials on-site. The AI instantly identifies 20 material classes, evaluates condition Grade A–E, predicts fair second-market valuation, and computes circular LCA carbon savings.
            </p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            {/* Left Col: Photo & Fine-Tune */}
            <div className="lg:col-span-5 space-y-6">
              <div className="bg-white rounded-2xl p-6 border border-gray-200 shadow-sm space-y-4">
                <h3 className="text-sm font-bold text-gray-900">1. Capture Material Photo</h3>
                {photo ? (
                  <div className="relative rounded-xl overflow-hidden border aspect-video bg-black">
                    <img src={photo} alt="Captured" className="w-full h-full object-cover" />
                    <div className="absolute bottom-2 right-2 flex gap-2">
                      <button onClick={() => setCameraOpen(true)} className="px-3 py-1 bg-white text-gray-900 text-xs font-semibold rounded-lg shadow">Retake</button>
                      <label className="px-3 py-1 bg-emerald-600 text-white text-xs font-semibold rounded-lg shadow cursor-pointer">
                        Upload <input type="file" accept="image/*" onChange={handleUpload} className="hidden" />
                      </label>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <button
                      onClick={() => setCameraOpen(true)}
                      className="w-full py-5 border-2 border-dashed border-emerald-300 bg-emerald-50/50 hover:bg-emerald-50 rounded-xl text-emerald-800 flex flex-col items-center justify-center gap-1 transition"
                    >
                      <span className="text-2xl">📷</span>
                      <span className="font-bold text-sm">Open Device Camera</span>
                      <span className="text-xs text-emerald-600">Supports phone rear-facing camera & webcams</span>
                    </button>
                    <label className="w-full py-2.5 border rounded-xl bg-gray-50 hover:bg-gray-100 text-gray-700 flex items-center justify-center gap-2 cursor-pointer text-xs font-semibold transition">
                      📁 Select Photo from Files
                      <input type="file" accept="image/*" onChange={handleUpload} className="hidden" />
                    </label>
                  </div>
                )}

                {/* Fine tune parameters */}
                <div className="pt-4 border-t space-y-3 text-xs">
                  <div className="flex justify-between items-center">
                    <span className="font-bold text-gray-700 uppercase tracking-wider text-[11px]">Fine-Tune Parameters</span>
                    {cRes && (
                      <button onClick={handleRecalc} className="text-emerald-700 font-bold hover:underline">Recalculate ↻</button>
                    )}
                  </div>
                  <div>
                    <label className="text-gray-600 block mb-1">Target Material</label>
                    <select value={selectedMat} onChange={(e) => setSelectedMat(e.target.value)} className="w-full border p-2 rounded-lg bg-white">
                      <option value="">Auto-detected or choose</option>
                      {["Bricks", "Concrete", "Cement Blocks", "Steel / Rebar", "Wood / Timber", "Tiles", "Glass", "PVC Pipes", "Metal Pipes", "Doors", "Windows", "Stones", "Granite", "Marble"].map(m => (
                        <option key={m} value={m}>{m}</option>
                      ))}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-gray-600 block mb-1">Age in Use: {age} yrs</label>
                      <input type="range" min="0" max="20" step="0.5" value={age} onChange={(e) => setAge(parseFloat(e.target.value))} className="w-full accent-emerald-600" />
                    </div>
                    <div>
                      <label className="text-gray-600 block mb-1">Wear / Defect: {damage}%</label>
                      <input type="range" min="0" max="50" step="1" value={damage} onChange={(e) => setDamage(parseFloat(e.target.value))} className="w-full accent-emerald-600" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-gray-600 block mb-1">Quantity</label>
                      <input type="number" value={qty} onChange={(e) => setQty(parseFloat(e.target.value) || 1)} className="w-full border p-2 rounded-lg" />
                    </div>
                    <div>
                      <label className="text-gray-600 block mb-1">Unit</label>
                      <select value={unit} onChange={(e) => setUnit(e.target.value)} className="w-full border p-2 rounded-lg bg-white">
                        <option value="Pieces">Pieces</option>
                        <option value="Tonnes">Tonnes</option>
                        <option value="Kg">Kg</option>
                        <option value="Sq Ft">Sq Ft</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>

              {/* Action Bridge to Selling */}
              {cRes && (
                <div className="bg-gradient-to-br from-emerald-50 to-teal-50 rounded-2xl p-5 border border-emerald-200 text-center space-y-2">
                  <h4 className="font-bold text-emerald-900 text-sm">Ready to trade this material?</h4>
                  <p className="text-xs text-emerald-700">Push this verified assessment directly into the BuildBack Marketplace.</p>
                  <button
                    onClick={() => onStartListing({ material_name: selectedMat, photo: photo, qData: qData, valData: valData, qty: qty, unit: unit })}
                    className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition"
                  >
                    List on Marketplace Now &rarr;
                  </button>
                </div>
              )}
            </div>

            {/* Right Col: Diagnostics Output */}
            <div className="lg:col-span-7">
              {analyzing ? (
                <div className="bg-white rounded-2xl p-12 border text-center space-y-3 min-h-[400px] flex flex-col items-center justify-center">
                  <div className="w-12 h-12 rounded-full border-4 border-emerald-200 border-t-emerald-600 animate-spin"></div>
                  <h3 className="text-base font-bold text-gray-900">Running Deep Neural Inference...</h3>
                  <p className="text-xs text-gray-500 max-w-sm">Classifying 1,280-dim visual embeddings and grading condition score A–E.</p>
                </div>
              ) : cRes ? (
                <div className="space-y-6">
                  {/* Result Header */}
                  <div className="bg-white rounded-2xl p-6 border border-gray-200 shadow-sm flex flex-wrap justify-between items-center gap-4">
                    <div>
                      <span className="text-[11px] font-bold text-emerald-600 uppercase tracking-wider">Identified Material Class</span>
                      <h2 className="text-2xl font-black text-gray-900">{selectedMat || cRes.predicted_material}</h2>
                      <span className="text-xs text-gray-500">Category: <strong className="text-gray-700">{cRes.category || 'Masonry & Structural'}</strong></span>
                    </div>
                    <div className="flex items-center gap-3">
                      <div className="text-right">
                        <span className="text-xs text-gray-500 block">AI Confidence</span>
                        <span className="text-lg font-bold text-emerald-600">{(cRes.confidence * 100).toFixed(1)}%</span>
                      </div>
                      <div className={`px-4 py-2 rounded-xl text-center font-black text-xl shadow-sm ${
                        qData?.quality_grade === 'A' ? 'bg-emerald-100 text-emerald-800' :
                        qData?.quality_grade === 'B' ? 'bg-blue-100 text-blue-800' :
                        qData?.quality_grade === 'C' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800'
                      }`}>
                        Grade {qData?.quality_grade || 'B'}
                      </div>
                    </div>
                  </div>

                  {/* Tabs */}
                  <div className="flex border-b gap-3 text-xs font-semibold text-gray-500">
                    <button onClick={() => setActiveTab('quality')} className={`pb-2.5 transition ${activeTab === 'quality' ? 'border-b-2 border-emerald-600 text-emerald-700 font-bold' : 'hover:text-gray-900'}`}>
                      Quality & Condition
                    </button>
                    <button onClick={() => setActiveTab('valuation')} className={`pb-2.5 transition ${activeTab === 'valuation' ? 'border-b-2 border-emerald-600 text-emerald-700 font-bold' : 'hover:text-gray-900'}`}>
                      AI Valuation
                    </button>
                    <button onClick={() => setActiveTab('lca')} className={`pb-2.5 transition ${activeTab === 'lca' ? 'border-b-2 border-emerald-600 text-emerald-700 font-bold' : 'hover:text-gray-900'}`}>
                      Circular LCA
                    </button>
                  </div>

                  {/* Tab 1: Quality */}
                  {activeTab === 'quality' && qData && (
                    <div className="bg-white rounded-2xl p-6 border space-y-4">
                      <div className="grid grid-cols-3 gap-3">
                        <div className="p-3 bg-slate-50 rounded-xl border text-center">
                          <span className="text-[11px] text-gray-500 block">Condition Score</span>
                          <span className="text-xl font-black text-gray-900">{qData.quality_score}/100</span>
                        </div>
                        <div className="p-3 bg-slate-50 rounded-xl border text-center">
                          <span className="text-[11px] text-gray-500 block">Wear Degradation</span>
                          <span className="text-xl font-black text-gray-900">{damage}%</span>
                        </div>
                        <div className="p-3 bg-slate-50 rounded-xl border text-center">
                          <span className="text-[11px] text-gray-500 block">Service Life</span>
                          <span className="text-xl font-black text-emerald-600">{Math.max(10, Math.round(100 - damage * 1.5))}%</span>
                        </div>
                      </div>
                      <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-100 text-xs text-emerald-950 space-y-1">
                        <span className="font-bold text-emerald-800">Circular Reuse Recommendation:</span>
                        <p>{qData.recommendation || "Certified for direct structural reuse, masonry walls, architectural accents, and high-performance secondary installations."}</p>
                      </div>
                    </div>
                  )}

                  {/* Tab 2: Valuation */}
                  {activeTab === 'valuation' && valData && (
                    <div className="bg-white rounded-2xl p-6 border space-y-4">
                      <div className="grid grid-cols-2 gap-4">
                        <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-200">
                          <span className="text-[11px] font-bold text-emerald-800 uppercase block">Estimated Second-Market Price</span>
                          <div className="text-2xl font-black text-emerald-900 mt-1">₹{valData.estimated_price.toLocaleString()}</div>
                          <span className="text-[11px] text-emerald-700">₹{valData.unit_price} / {unit}</span>
                        </div>
                        <div className="p-4 bg-gray-50 rounded-xl border">
                          <span className="text-[11px] font-bold text-gray-600 uppercase block">Virgin Market Price</span>
                          <div className="text-2xl font-black text-gray-900 mt-1">₹{valData.virgin_price_comparison.toLocaleString()}</div>
                          <span className="text-[11px] text-emerald-600 font-bold">~{valData.discount_pct}% Discount vs Virgin</span>
                        </div>
                      </div>
                      <div className="p-3 bg-slate-50 rounded-xl border text-xs text-gray-600 flex justify-between">
                        <span>Liquidation Range: <b>₹{valData.price_range_low.toLocaleString()}</b></span>
                        <span>Ceiling: <b>₹{valData.price_range_high.toLocaleString()}</b></span>
                      </div>
                    </div>
                  )}

    // ==========================================
    // 4. Create Listing Wizard (9 Steps)
    // ==========================================
    function WizardView({ onNavigate, user, initialData = null }) {
      const [step, setStep] = useState(initialData?.valData ? 3 : 1);
      const [cameraOpen, setCameraOpen] = useState(false);
      const [photo, setPhoto] = useState(initialData?.photo || null);
      const [aiData, setAiData] = useState(null);
      const [selectedMat, setSelectedMat] = useState(initialData?.material_name || '');
      const [age, setAge] = useState(1.5);
      const [damage, setDamage] = useState(8);
      const [qData, setQData] = useState(initialData?.qData || null);
      const [qty, setQty] = useState(initialData?.qty || 1000);
      const [unit, setUnit] = useState(initialData?.unit || 'Pieces');
      const [price, setPrice] = useState(initialData?.valData?.estimated_price || '');
      const [valData, setValData] = useState(initialData?.valData || null);
      const [city, setCity] = useState(user?.city || 'Bangalore');
      const [loading, setLoading] = useState(false);
      const [done, setDone] = useState(false);

      const handlePhoto = async (dataUrl) => {
        setPhoto(dataUrl);
        setLoading(true);
        setStep(2);
        try {
          const res = await API.req('/api/ml/predict-material', {
            method: 'POST',
            body: { base64_image: dataUrl }
          });
          setAiData(res);
          setSelectedMat(res.predicted_material);

          // Quality & Price auto-calc
          const q = await API.req('/api/ml/assess-quality', { method: 'POST', body: { material_name: res.predicted_material, age_years: age, damage_percentage: damage } });
          setQData(q);
          const p = await API.req('/api/ml/predict-price', { method: 'POST', body: { material_name: res.predicted_material, quantity: qty, unit: unit, quality_score: q.quality_score, age_years: age, damage_percentage: damage, city } });
          setValData(p);
          setPrice(p.estimated_price);
        } catch (e) {
          alert('Analysis error: ' + e.message);
        } finally {
          setLoading(false);
        }
      };

      const handlePublish = async () => {
        if (!user) { alert('Please sign in to publish listings.'); onNavigate('login'); return; }
        setLoading(true);
        try {
          await API.req('/api/listings', {
            method: 'POST',
            body: {
              material_name: selectedMat,
              category: aiData?.category || 'Masonry',
              quantity: parseFloat(qty),
              unit,
              age_years: parseFloat(age),
              damage_percentage: parseFloat(damage),
              price: parseFloat(price),
              quality_grade: qData?.quality_grade || 'B',
              quality_score: qData?.quality_score || 80,
              ai_confidence: aiData?.confidence || 0.9,
              ai_estimated_price: valData?.estimated_price || parseFloat(price),
              city,
              state: 'Karnataka',
              image_url: photo || 'https://images.unsplash.com/photo-1590069261209-f8e9b8642343?w=800&auto=format&fit=crop&q=60'
            }
          });
          setDone(true);
        } catch (e) {
          alert('Publish failed: ' + e.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-2xl mx-auto px-4 py-8 fade-in">
          <div className="bg-white rounded-3xl border border-gray-200 p-8 shadow-sm space-y-6">
            <h2 className="text-xl font-bold text-gray-900">Sell Surplus Material (AI 9-Step Wizard)</h2>

            {done ? (
              <div className="text-center py-8 space-y-3">
                <div className="text-4xl text-emerald-600">✓</div>
                <h3 className="text-xl font-bold text-gray-900">Listing Published to Marketplace!</h3>
                <p className="text-xs text-gray-500">Contractors and buyers can now discover your material and submit offers.</p>
                <button onClick={() => onNavigate('marketplace')} className="px-6 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">View in Marketplace</button>
              </div>
            ) : (
              <>
                {step === 1 && (
                  <div className="space-y-4 text-center">
                    <p className="text-xs text-gray-500">Capture a photo with your device camera or upload an image file to trigger computer vision analysis.</p>
                    <div className="grid grid-cols-2 gap-4">
                      <button onClick={() => setCameraOpen(true)} className="p-6 border-2 border-emerald-500 bg-emerald-50/50 rounded-2xl text-xs font-bold text-emerald-800">
                        📷 Open Device Camera
                      </button>
                      <label className="p-6 border-2 border-gray-200 rounded-2xl text-xs font-bold text-gray-700 hover:bg-gray-50 cursor-pointer flex flex-col items-center justify-center">
                        📁 Upload Photo File
                        <input type="file" accept="image/*" onChange={(e) => {
                          const f = e.target.files[0];
                          if (f) {
                            const r = new FileReader();
                            r.onload = ev => handlePhoto(ev.target.result);
                            r.readAsDataURL(f);
                          }
                        }} className="hidden" />
                      </label>
                    </div>
                  </div>
                )}

                {step === 2 && (
                  <div className="space-y-4">
                    {loading ? (
                      <p className="text-center py-8 text-xs text-emerald-700 font-semibold">Analyzing image with MobileNetV2...</p>
                    ) : (
                      <>
                        <div className="flex gap-4 items-center">
                          {photo && <img src={photo} className="w-24 h-24 object-cover rounded-xl border" />}
                          <div>
                            <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">{(aiData?.confidence * 100).toFixed(1)}% AI Confidence</span>
                            <h3 className="text-lg font-bold text-gray-900 mt-1">{aiData?.predicted_material}</h3>
                            <p className="text-xs text-gray-500">Category: {aiData?.category}</p>
                          </div>
                        </div>

                        <div>
                          <label className="text-xs font-semibold text-gray-700 block mb-1">Confirm or Correct Material:</label>
                          <input type="text" value={selectedMat} onChange={(e) => setSelectedMat(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs" />
                        </div>

                        <button onClick={() => setStep(3)} className="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">Proceed to Quality & Pricing →</button>
                      </>
                    )}
                  </div>
                )}

                {step === 3 && (
                  <div className="space-y-4">
                    <div className="p-4 bg-gray-50 rounded-2xl text-xs space-y-2">
                      <p className="font-bold text-gray-800">AI Quality Assessment: Grade {qData?.quality_grade} ({qData?.quality_score}/100)</p>
                      <p className="text-gray-500">{qData?.condition_description}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-semibold text-gray-600 block">Quantity</label>
                        <input type="number" value={qty} onChange={(e) => setQty(e.target.value)} className="w-full px-3 py-1.5 border rounded-lg text-xs" />
                      </div>
                      <div>
                        <label className="text-[11px] font-semibold text-gray-600 block">Unit</label>
                        <select value={unit} onChange={(e) => setUnit(e.target.value)} className="w-full px-3 py-1.5 border rounded-lg text-xs bg-white">
                          <option value="Pieces">Pieces</option>
                          <option value="Tonnes">Tonnes</option>
                          <option value="Sq.Ft">Sq.Ft</option>
                          <option value="Meters">Meters</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-gray-600 block">Your Selling Price (₹)</label>
                      <input type="number" value={price} onChange={(e) => setPrice(e.target.value)} className="w-full px-3 py-2 border-2 border-emerald-500 rounded-xl text-base font-bold text-emerald-900" />
                      <span className="text-[10px] text-gray-500">AI Estimated Fair Value: ₹{valData?.estimated_price?.toLocaleString()}</span>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-gray-600 block">Location City</label>
                      <input type="text" value={city} onChange={(e) => setCity(e.target.value)} className="w-full px-3 py-1.5 border rounded-lg text-xs" />
                    </div>

                    <div className="flex justify-between pt-2">
                      <button onClick={() => setStep(2)} className="px-4 py-2 border rounded-xl text-xs">Back</button>
                      <button onClick={handlePublish} disabled={loading} className="px-6 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold shadow-md">
                        {loading ? 'Publishing...' : 'Publish Listing'}
                      </button>
                    </div>
                  </div>
                )}
              </>
            )}
          </div>

          <CameraModal isOpen={cameraOpen} onClose={() => setCameraOpen(false)} onCapture={handlePhoto} />
        </div>
      );
    }

    // ==========================================
    // 9. Auth Views
    // ==========================================
    function LoginView({ onNavigate, onLogin }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await API.req('/api/auth/login', { method: 'POST', body: { email, password } });
          API.setToken(res.access_token);
          onLogin(res.user);
          onNavigate('marketplace');
        } catch (err) {
          alert('Login failed: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      const fill = (e, p) => { setEmail(e); setPassword(p); };

      return (
        <div className="max-w-sm mx-auto px-4 py-16 fade-in">
          <div className="bg-white rounded-3xl border p-8 shadow-lg space-y-4">
            <h2 className="text-xl font-bold text-gray-900 text-center">Sign In to REBUILD AI</h2>
            <form onSubmit={handleLogin} className="space-y-3 text-xs">
              <input type="email" placeholder="Email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
              <input type="password" placeholder="Password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
              <button type="submit" disabled={loading} className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm">
                {loading ? 'Authenticating...' : 'Sign In'}
              </button>
            </form>

            <div className="pt-4 border-t text-[11px] text-center space-y-1">
              <p className="text-gray-400 uppercase font-bold">Local Demo Accounts</p>
              <div className="flex justify-center gap-2">
                <button onClick={() => fill('seller@demolitioncorp.com', 'Seller@1234')} className="px-2 py-1 border rounded hover:bg-gray-50">Seller</button>
                <button onClick={() => fill('buyer@greenbuild.in', 'Buyer@1234')} className="px-2 py-1 border rounded hover:bg-gray-50">Buyer</button>
                <button onClick={() => fill('admin@rebuildai.com', 'Admin@1234')} className="px-2 py-1 border rounded hover:bg-gray-50">Admin</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function RegisterView({ onNavigate, onLogin }) {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [userType, setUserType] = useState('BOTH');

      const handleReg = async (e) => {
        e.preventDefault();
        try {
          const res = await API.req('/api/auth/register', {
            method: 'POST',
            body: { name, email, password, user_type: userType, city: 'Bangalore', state: 'Karnataka' }
          });
          API.setToken(res.access_token);
          onLogin(res.user);
          onNavigate('marketplace');
        } catch (err) {
          alert('Registration error: ' + err.message);
        }
      };

      return (
        <div className="max-w-sm mx-auto px-4 py-16 fade-in">
          <div className="bg-white rounded-3xl border p-8 shadow-lg space-y-4">
            <h2 className="text-xl font-bold text-gray-900 text-center">Create Account</h2>
            <form onSubmit={handleReg} className="space-y-3 text-xs">
              <input type="text" placeholder="Full / Company Name" required value={name} onChange={e => setName(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
              <input type="email" placeholder="Email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
              <input type="password" placeholder="Password (min 6 chars)" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
              <select value={userType} onChange={e => setUserType(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm bg-white">
                <option value="BOTH">Both (Buyer & Seller)</option>
                <option value="SELLER">Demolition Contractor (Seller)</option>
                <option value="BUYER">Builder / Architect (Buyer)</option>
              </select>
              <button type="submit" className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm">
                Register
              </button>
            </form>
          </div>
        </div>
      );
    }

    // Render root React component
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

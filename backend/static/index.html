<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REBUILD AI — Construction Waste Reuse & Second-Market Platform</title>
  <meta name="description" content="AI platform for construction material identification, quality grading, price prediction, and circular LCA calculations.">
  <link rel="icon" type="image/svg+xml" href="https://img.icons8.com/color/96/recycle-sign.png">

  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .fade-in { animation: fadeIn 0.25s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <!-- Application Bundle -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // API Helper
    const API = {
      getToken: () => localStorage.getItem('rebuild_token'),
      setToken: (t) => localStorage.setItem('rebuild_token', t),
      clearToken: () => localStorage.removeItem('rebuild_token'),

      async req(endpoint, opts = {}) {
        const headers = { ...(opts.headers || {}) };
        const token = this.getToken();
        if (token) headers['Authorization'] = `Bearer ${token}`;

        if (opts.body && !(opts.body instanceof FormData)) {
          headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(opts.body);
        }

        const res = await fetch(endpoint, { ...opts, headers });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || 'Request failed');
        }
        return res.json();
      }
    };

    // ==========================================
    // Real Camera Modal Component
    // ==========================================
    function CameraModal({ isOpen, onClose, onCapture }) {
      const [stream, setStream] = useState(null);
      const [photo, setPhoto] = useState(null);
      const [error, setError] = useState(null);
      const [facingMode, setFacingMode] = useState('environment');
      const videoRef = useRef(null);
      const canvasRef = useRef(null);

      useEffect(() => {
        if (isOpen && !photo) {
          startCam();
        } else {
          stopCam();
        }
        return () => stopCam();
      }, [isOpen, facingMode]);

      const startCam = async () => {
        stopCam();
        setError(null);
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setError('Camera API is not supported in this browser. Please use file upload.');
          return;
        }
        try {
          const s = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          setStream(s);
          if (videoRef.current) videoRef.current.srcObject = s;
        } catch (err) {
          console.error('Camera error:', err);
          if (err.name === 'NotAllowedError') setError('Camera permission was denied. Please allow camera permissions or upload an image.');
          else if (err.name === 'NotFoundError') setError('No camera found on this device.');
          else setError('Unable to access camera: ' + err.message);
        }
      };

      const stopCam = () => {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          setStream(null);
        }
        if (videoRef.current) videoRef.current.srcObject = null;
      };

      const takeSnapshot = () => {
        const v = videoRef.current;
        const c = canvasRef.current;
        if (!v || !c) return;
        c.width = v.videoWidth || 640;
        c.height = v.videoHeight || 480;
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        const dataUrl = c.toDataURL('image/jpeg', 0.92);
        setPhoto(dataUrl);
        stopCam();
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm fade-in">
          <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl">
            <div className="px-6 py-4 border-b flex justify-between items-center">
              <span className="font-bold text-gray-900 text-base">Device Camera Capture</span>
              <button onClick={() => { stopCam(); setPhoto(null); onClose(); }} className="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
            </div>

            <div className="relative bg-black min-h-[300px] max-h-[420px] flex items-center justify-center overflow-hidden">
              {error ? (
                <div className="p-6 text-center text-red-200">
                  <p className="text-sm font-semibold mb-3">{error}</p>
                  <button onClick={startCam} className="px-4 py-1.5 bg-white/20 hover:bg-white/30 text-white rounded-lg text-xs">Retry Camera</button>
                </div>
              ) : photo ? (
                <img src={photo} alt="Captured" className="w-full h-auto max-h-[420px] object-contain" />
              ) : (
                <>
                  <video ref={videoRef} autoPlay playsInline muted className="w-full h-auto max-h-[420px] object-contain" />
                  <div className="absolute inset-8 border-2 border-dashed border-white/40 rounded-2xl pointer-events-none flex items-center justify-center">
                    <span className="text-white/80 text-xs bg-black/50 px-3 py-1 rounded-full">Center material in viewfinder</span>
                  </div>
                  <button
                    onClick={() => setFacingMode(prev => prev === 'environment' ? 'user' : 'environment')}
                    className="absolute top-3 right-3 px-3 py-1 bg-black/60 text-white rounded-full text-xs"
                  >
                    Flip Camera
                  </button>
                </>
              )}
              <canvas ref={canvasRef} className="hidden" />
            </div>

            <div className="p-4 bg-gray-50 flex justify-between items-center">
              {photo ? (
                <>
                  <button onClick={() => { setPhoto(null); startCam(); }} className="px-4 py-2 border border-gray-300 text-gray-700 rounded-xl text-xs font-semibold hover:bg-white">
                    Retake Photo
                  </button>
                  <button onClick={() => { onCapture(photo); stopCam(); setPhoto(null); onClose(); }} className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md">
                    Use This Photo
                  </button>
                </>
              ) : (
                <>
                  <button onClick={() => { stopCam(); onClose(); }} className="px-4 py-2 text-gray-500 text-xs">Cancel</button>
                  <button onClick={takeSnapshot} disabled={!!error} className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md">
                    Capture Photo
                  </button>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // Main App Root Component
    // ==========================================
    function App() {
      const [route, setRoute] = useState('landing');
      const [user, setUser] = useState(null);
      const [selectedListingId, setSelectedListingId] = useState(null);

      useEffect(() => {
        checkAuth();
      }, []);

      const checkAuth = async () => {
        if (API.getToken()) {
          try {
            const me = await API.req('/api/auth/me');
            setUser(me);
          } catch (e) {
            API.clearToken();
            setUser(null);
          }
        }
      };

      const handleLogout = () => {
        API.clearToken();
        setUser(null);
        setRoute('landing');
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Navigation Bar */}
          <nav className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setRoute('landing')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white text-xl font-black shadow-md shadow-emerald-600/20">
                  ♻
                </div>
                <div>
                  <span className="font-extrabold text-xl text-gray-900 tracking-tight">REBUILD <span className="text-emerald-600">AI</span></span>
                  <span className="block text-[10px] uppercase font-bold text-emerald-700 tracking-widest">Circular Construction</span>
                </div>
              </div>

              <div className="hidden md:flex items-center gap-2 text-sm font-semibold text-gray-700">
                <button onClick={() => setRoute('marketplace')} className={`px-3 py-1.5 rounded-lg ${route === 'marketplace' ? 'bg-emerald-50 text-emerald-700' : 'hover:bg-gray-100'}`}>Marketplace</button>
                <button onClick={() => setRoute('wizard')} className={`px-3 py-1.5 rounded-lg ${route === 'wizard' ? 'bg-emerald-50 text-emerald-700' : 'hover:bg-gray-100'}`}>+ Sell Material (AI Wizard)</button>
                <button onClick={() => setRoute('evaluation')} className={`px-3 py-1.5 rounded-lg ${route === 'evaluation' ? 'bg-emerald-50 text-emerald-700' : 'hover:bg-gray-100'}`}>AI Model Metrics</button>
                {user && (user.user_type === 'SELLER' || user.user_type === 'BOTH') && (
                  <button onClick={() => setRoute('seller')} className={`px-3 py-1.5 rounded-lg ${route === 'seller' ? 'bg-emerald-50 text-emerald-700' : 'hover:bg-gray-100'}`}>Seller Hub</button>
                )}
                {user && (user.user_type === 'BUYER' || user.user_type === 'BOTH') && (
                  <button onClick={() => setRoute('buyer')} className={`px-3 py-1.5 rounded-lg ${route === 'buyer' ? 'bg-emerald-50 text-emerald-700' : 'hover:bg-gray-100'}`}>My Orders</button>
                )}
                {user && user.user_type === 'ADMIN' && (
                  <button onClick={() => setRoute('admin')} className={`px-3 py-1.5 rounded-lg ${route === 'admin' ? 'bg-purple-50 text-purple-700' : 'hover:bg-gray-100'}`}>Admin Telemetry</button>
                )}
              </div>

              <div className="flex items-center gap-3">
                {user ? (
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold text-gray-900">{user.name}</span>
                    <button onClick={handleLogout} className="px-2.5 py-1 text-xs font-semibold text-red-600 hover:bg-red-50 rounded-lg">Sign Out</button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <button onClick={() => setRoute('login')} className="px-3.5 py-1.5 text-xs font-bold text-gray-700 hover:bg-gray-100 rounded-lg">Sign In</button>
                    <button onClick={() => setRoute('register')} className="px-4 py-1.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-sm">Get Started</button>
                  </div>
                )}
              </div>
            </div>
          </nav>

          {/* Main Body Switcher */}
          <main className="flex-1">
            {route === 'landing' && <LandingView onNavigate={setRoute} />}
            {route === 'marketplace' && <MarketplaceView onSelect={(id) => { setSelectedListingId(id); setRoute('detail'); }} onNavigate={setRoute} />}
            {route === 'detail' && <DetailView id={selectedListingId} onBack={() => setRoute('marketplace')} onNavigate={setRoute} user={user} />}
            {route === 'wizard' && <WizardView onNavigate={setRoute} user={user} />}
            {route === 'seller' && <SellerView onNavigate={setRoute} />}
            {route === 'buyer' && <BuyerView onSelect={(id) => { setSelectedListingId(id); setRoute('detail'); }} onNavigate={setRoute} />}
            {route === 'admin' && <AdminView onSelect={(id) => { setSelectedListingId(id); setRoute('detail'); }} />}
            {route === 'evaluation' && <EvaluationView />}
            {route === 'login' && <LoginView onNavigate={setRoute} onLogin={setUser} />}
            {route === 'register' && <RegisterView onNavigate={setRoute} onLogin={setUser} />}
          </main>

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 py-10 text-xs border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div>
                <span className="font-bold text-white text-sm">REBUILD AI</span> — AI-Powered Construction Waste Reuse & Second-Market Platform
              </div>
              <div>MobileNetV2 • Gradient Boosting (R²=0.935) • Circular LCA • MIT License</div>
            </div>
          </footer>
        </div>
      );
    }

    // ==========================================
    // 1. Landing Page View
    // ==========================================
    function LandingView({ onNavigate }) {
      const [stats, setStats] = useState({ total_landfill_diverted_tonnes: 48.5, total_co2_saved_kg: 14200, total_trees_equivalent: 645, total_transactions: 18 });

      useEffect(() => {
        API.req('/api/environmental/summary').then(setStats).catch(() => {});
      }, []);

      return (
        <div className="fade-in space-y-16 pb-16">
          <section className="bg-gradient-to-b from-emerald-50/70 via-white to-white py-20 px-4 text-center border-b">
            <div className="max-w-4xl mx-auto">
              <span className="inline-block px-3.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold mb-4">
                Circular Construction Waste Infrastructure
              </span>
              <h1 className="text-4xl sm:text-6xl font-extrabold text-gray-900 tracking-tight leading-tight mb-6">
                Give Construction Waste <br />
                <span className="text-emerald-600">A Profitable Second Life</span>
              </h1>
              <p className="text-base text-gray-600 max-w-xl mx-auto mb-8">
                Identify salvaged construction materials instantly using your device camera, grade condition A–E, and trade verified surplus with machine-learning price predictions.
              </p>
              <div className="flex justify-center gap-4">
                <button onClick={() => onNavigate('wizard')} className="px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/20 text-sm">
                  Scan & Sell Material (AI Camera)
                </button>
                <button onClick={() => onNavigate('marketplace')} className="px-8 py-3.5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-800 font-bold rounded-xl text-sm">
                  Explore Marketplace
                </button>
              </div>

              {/* Stats row */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-16 max-w-4xl mx-auto">
                <div className="p-5 bg-white rounded-2xl border border-gray-100 shadow-sm">
                  <div className="text-3xl font-black text-emerald-600">{stats.total_landfill_diverted_tonnes}t</div>
                  <span className="text-xs text-gray-500 uppercase font-bold">Landfill Diverted</span>
                </div>
                <div className="p-5 bg-white rounded-2xl border border-gray-100 shadow-sm">
                  <div className="text-3xl font-black text-teal-600">{stats.total_co2_saved_kg.toLocaleString()} kg</div>
                  <span className="text-xs text-gray-500 uppercase font-bold">Avoided CO₂e</span>
                </div>
                <div className="p-5 bg-white rounded-2xl border border-gray-100 shadow-sm">
                  <div className="text-3xl font-black text-blue-600">{stats.total_trees_equivalent}</div>
                  <span className="text-xs text-gray-500 uppercase font-bold">Trees Equivalent</span>
                </div>
                <div className="p-5 bg-white rounded-2xl border border-gray-100 shadow-sm">
                  <div className="text-3xl font-black text-indigo-600">{stats.total_transactions}</div>
                  <span className="text-xs text-gray-500 uppercase font-bold">Completed Trades</span>
                </div>
              </div>
            </div>
          </section>

          {/* Workflow */}
          <section className="max-w-6xl mx-auto px-4">
            <h2 className="text-2xl font-bold text-center text-gray-900 mb-8">AI-Powered Circular Architecture</h2>
            <div className="grid sm:grid-cols-3 gap-6">
              <div className="p-6 bg-white rounded-2xl border border-gray-200 shadow-sm">
                <span className="text-2xl font-black text-emerald-600">01</span>
                <h3 className="font-bold text-base text-gray-900 mt-2 mb-1">Real-Time Camera Scan</h3>
                <p className="text-xs text-gray-500">MobileNetV2 deep learning extracts 1280-dim feature vectors directly from site photographs.</p>
              </div>
              <div className="p-6 bg-white rounded-2xl border border-gray-200 shadow-sm">
                <span className="text-2xl font-black text-emerald-600">02</span>
                <h3 className="font-bold text-base text-gray-900 mt-2 mb-1">Grade A–E Condition</h3>
                <p className="text-xs text-gray-500">Multimodal wear algorithms evaluate surface cracks and degradation for safe secondary reuse.</p>
              </div>
              <div className="p-6 bg-white rounded-2xl border border-gray-200 shadow-sm">
                <span className="text-2xl font-black text-emerald-600">03</span>
                <h3 className="font-bold text-base text-gray-900 mt-2 mb-1">Gradient Boosting Price</h3>
                <p className="text-xs text-gray-500">Empirical market regressions (R² = 0.935) provide fair second-hand valuations and negotiation ranges.</p>
              </div>
            </div>
          </section>
        </div>
      );
    }

    // ==========================================
    // 2. Marketplace View
    // ==========================================
    function MarketplaceView({ onSelect, onNavigate }) {
      const [listings, setListings] = useState([]);
      const [category, setCategory] = useState('');
      const [search, setSearch] = useState('');
      const [grade, setGrade] = useState('');
      const [cameraOpen, setCameraOpen] = useState(false);
      const [similarModalOpen, setSimilarModalOpen] = useState(false);
      const [similarResults, setSimilarResults] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        loadListings();
      }, [category, grade]);

      const loadListings = async () => {
        setLoading(true);
        try {
          const params = new URLSearchParams();
          if (category) params.append('category', category);
          if (grade) params.append('quality_grade', grade);
          if (search) params.append('search', search);
          const data = await API.req('/api/listings?' + params.toString());
          setListings(data);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const handlePhotoSearch = async (dataUrl) => {
        setSimilarModalOpen(true);
        try {
          const res = await API.req('/api/ml/image-search', {
            method: 'POST',
            body: { base64_image: dataUrl }
          });
          setSimilarResults(res);
        } catch (e) {
          alert('Similar search failed: ' + e.message);
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-6 fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h1 className="text-3xl font-extrabold text-gray-900">Materials Marketplace</h1>
              <p className="text-xs text-gray-500">Browse and trade verified salvaged construction inventory.</p>
            </div>
            <button onClick={() => setCameraOpen(true)} className="px-4 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
              📷 Visual Similarity Camera
            </button>
          </div>

          {/* Filter Bar */}
          <div className="p-4 bg-white rounded-2xl border border-gray-200 shadow-sm flex flex-wrap gap-3">
            <input
              type="text"
              placeholder="Search material..."
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && loadListings()}
              className="px-3 py-2 border rounded-xl text-xs flex-1 min-w-[200px]"
            />
            <select value={category} onChange={(e) => setCategory(e.target.value)} className="px-3 py-2 border rounded-xl text-xs bg-white">
              <option value="">All Categories</option>
              <option value="Masonry">Masonry</option>
              <option value="Metals & Structural">Metals & Structural</option>
              <option value="Aggregates & Masonry">Aggregates & Masonry</option>
              <option value="Joinery & Fixtures">Joinery & Fixtures</option>
              <option value="Finishing & Ceramics">Finishing & Ceramics</option>
            </select>
            <select value={grade} onChange={(e) => setGrade(e.target.value)} className="px-3 py-2 border rounded-xl text-xs bg-white">
              <option value="">All Grades</option>
              <option value="A">Grade A (Excellent)</option>
              <option value="B">Grade B (Good)</option>
              <option value="C">Grade C (Moderate)</option>
            </select>
            <button onClick={loadListings} className="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Filter</button>
          </div>

          {/* Grid */}
          {loading ? (
            <p className="text-center py-16 text-gray-500 text-sm">Loading materials...</p>
          ) : listings.length === 0 ? (
            <p className="text-center py-16 text-gray-500 text-sm">No listings found matching criteria.</p>
          ) : (
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {listings.map(l => (
                <div key={l.id} onClick={() => onSelect(l.id)} className="bg-white rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition overflow-hidden cursor-pointer flex flex-col justify-between group">
                  <div>
                    <img src={l.image_url} alt={l.material_name} className="w-full h-48 object-cover group-hover:scale-105 transition duration-300" />
                    <div className="p-4">
                      <div className="flex justify-between items-start mb-1">
                        <h3 className="font-bold text-gray-900 text-base">{l.material_name}</h3>
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${l.quality_grade === 'A' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}`}>
                          Grade {l.quality_grade}
                        </span>
                      </div>
                      <p className="text-xs text-gray-500 mb-2">📍 {l.city}, {l.state}</p>
                      <p className="text-xs text-gray-600 line-clamp-1">{l.original_usage}</p>
                    </div>
                  </div>
                  <div className="p-4 border-t flex justify-between items-center bg-gray-50/50">
                    <div>
                      <span className="text-lg font-black text-emerald-700">₹{l.price.toLocaleString()}</span>
                      <p className="text-[10px] text-gray-500">{l.quantity} {l.unit}</p>
                    </div>
                    <span className="text-xs font-bold text-emerald-600 hover:underline">View Details →</span>
                  </div>
                </div>
              ))}
            </div>
          )}

          <CameraModal isOpen={cameraOpen} onClose={() => setCameraOpen(false)} onCapture={handlePhotoSearch} />

          {/* Similar modal */}
          {similarModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-gray-900">Visually Similar Materials</h3>
                  <button onClick={() => setSimilarModalOpen(false)} className="text-gray-400 hover:text-gray-600">✕</button>
                </div>
                <div className="space-y-2 max-h-[60vh] overflow-y-auto">
                  {similarResults.map(r => (

                      <img src={r.image_url} className="w-14 h-14 rounded-lg object-cover" />
                      <div className="flex-1">

    // ==========================================
    // 3. Detail View & Purchase Dialog
    // ==========================================
    function DetailView({ id, onBack, onNavigate, user }) {
      const [listing, setListing] = useState(null);
      const [loading, setLoading] = useState(true);
      const [offerPrice, setOfferPrice] = useState('');
      const [offerQty, setOfferQty] = useState('');
      const [dialogOpen, setDialogOpen] = useState(false);
      const [sent, setSent] = useState(false);

      useEffect(() => {
        API.req('/api/listings/' + id).then(data => {
          setListing(data);
          setOfferPrice(data.price);
          setOfferQty(data.quantity);
          setLoading(false);
        }).catch(err => setLoading(false));
      }, [id]);

      const handleSendOffer = async (e) => {
        e.preventDefault();
        if (!user) { alert('Please log in to submit offers.'); onNavigate('login'); return; }
        try {
          await API.req('/api/purchases/request', {
            method: 'POST',
            body: {
              listing_id: id,
              quantity: parseFloat(offerQty),
              proposed_price: parseFloat(offerPrice),
              message: 'Requesting fast inspection & pickup.'
            }
          });
          setSent(true);
        } catch (e) {
          alert('Offer failed: ' + e.message);
        }
      };

      if (loading) return <p className="text-center py-20 text-gray-500">Loading details...</p>;
      if (!listing) return <p className="text-center py-20 text-red-500">Listing not found.</p>;

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 space-y-6 fade-in">
          <button onClick={onBack} className="text-xs font-bold text-gray-600 hover:text-emerald-700">← Back to Marketplace</button>
          <div className="grid md:grid-cols-2 gap-8">
            <img src={listing.image_url} alt={listing.material_name} className="w-full h-80 object-cover rounded-3xl border shadow-sm" />
            <div className="space-y-4">
              <span className="px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">Quality Grade {listing.quality_grade} ({listing.quality_score}/100)</span>
              <h1 className="text-3xl font-extrabold text-gray-900">{listing.material_name}</h1>
              <p className="text-xs text-gray-500">📍 {listing.city}, {listing.state} • Pickup: {listing.availability}</p>

              <div className="p-4 bg-gray-50 rounded-2xl border flex justify-between items-center">
                <div>
                  <span className="text-xs text-gray-500 uppercase font-semibold">Asking Price</span>
                  <div className="text-3xl font-black text-emerald-700">₹{listing.price.toLocaleString()}</div>
                </div>
                <div className="text-right">
                  <span className="text-xs text-gray-500 uppercase font-semibold">Quantity</span>
                  <div className="text-lg font-bold text-gray-900">{listing.quantity} {listing.unit}</div>
                </div>
              </div>

              <div className="p-4 bg-emerald-900 text-white rounded-2xl text-xs space-y-1">
                <span className="font-bold text-emerald-300 uppercase">Certified Circular Impact</span>
                <p>Estimated Landfill Diversion: <b>{((listing.quantity * 3) / 1000).toFixed(2)} tonnes</b></p>
                <p>Avoided Embodied Carbon: <b>{(listing.quantity * 0.72).toFixed(0)} kg CO₂e</b></p>
              </div>

              <button onClick={() => setDialogOpen(true)} className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow-md">
                Make Purchase Offer
              </button>
            </div>
          </div>

          {dialogOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                {sent ? (
                  <div className="text-center py-4">
                    <p className="font-bold text-emerald-700 text-base mb-1">Offer Submitted!</p>
                    <p className="text-xs text-gray-500 mb-4">Seller has been notified of your offer.</p>
                    <button onClick={() => { setDialogOpen(false); setSent(false); }} className="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold">Done</button>
                  </div>
                ) : (
                  <form onSubmit={handleSendOffer} className="space-y-3">
                    <h3 className="font-bold text-gray-900 text-sm">Send Purchase Offer</h3>
                    <div>
                      <label className="text-[11px] font-semibold text-gray-600 block">Proposed Price (₹)</label>
                      <input type="number" required value={offerPrice} onChange={(e) => setOfferPrice(e.target.value)} className="w-full px-3 py-1.5 border rounded-lg text-sm font-bold text-emerald-800" />
                    </div>
                    <div>
                      <label className="text-[11px] font-semibold text-gray-600 block">Quantity ({listing.unit})</label>
                      <input type="number" required value={offerQty} onChange={(e) => setOfferQty(e.target.value)} className="w-full px-3 py-1.5 border rounded-lg text-sm" />
                    </div>
                    <div className="flex justify-end gap-2 pt-2">
                      <button type="button" onClick={() => setDialogOpen(false)} className="px-3 py-1.5 border rounded-lg text-xs">Cancel</button>
                      <button type="submit" className="px-4 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold">Submit</button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 4. Create Listing Wizard (9 Steps)
    // ==========================================
    function WizardView({ onNavigate, user }) {
      const [step, setStep] = useState(1);
      const [cameraOpen, setCameraOpen] = useState(false);
      const [photo, setPhoto] = useState(null);
      const [aiData, setAiData] = useState(null);
      const [selectedMat, setSelectedMat] = useState('');
      const [age, setAge] = useState(1.5);
      const [damage, setDamage] = useState(8);
      const [qData, setQData] = useState(null);
      const [qty, setQty] = useState(1000);
      const [unit, setUnit] = useState('Pieces');
      const [price, setPrice] = useState('');
      const [valData, setValData] = useState(null);
      const [city, setCity] = useState(user?.city || 'Bangalore');
      const [loading, setLoading] = useState(false);
      const [done, setDone] = useState(false);

      const handlePhoto = async (dataUrl) => {
        setPhoto(dataUrl);
        setLoading(true);
        setStep(2);
        try {
          const res = await API.req('/api/ml/predict-material', {
            method: 'POST',
            body: { base64_image: dataUrl }
          });
          setAiData(res);
          setSelectedMat(res.predicted_material);

          // Quality & Price auto-calc
          const q = await API.req('/api/ml/assess-quality', { method: 'POST', body: { material_name: res.predicted_material, age_years: age, damage_percentage: damage } });
          setQData(q);
          const p = await API.req('/api/ml/predict-price', { method: 'POST', body: { material_name: res.predicted_material, quantity: qty, unit: unit, quality_score: q.quality_score, age_years: age, damage_percentage: damage, city } });
          setValData(p);
          setPrice(p.estimated_price);
        } catch (e) {
          alert('Analysis error: ' + e.message);
        } finally {
          setLoading(false);
        }
      };

      const handlePublish = async () => {
        if (!user) { alert('Please sign in to publish listings.'); onNavigate('login'); return; }
        setLoading(true);
        try {
          await API.req('/api/listings', {
            method: 'POST',
            body: {
              material_name: selectedMat,
              category: aiData?.category || 'Masonry',
              quantity: parseFloat(qty),
              unit,
              age_years: parseFloat(age),
              damage_percentage: parseFloat(damage),
              price: parseFloat(price),
              quality_grade: qData?.quality_grade || 'B',
              quality_score: qData?.quality_score || 80,
              ai_confidence: aiData?.confidence || 0.9,
              ai_estimated_price: valData?.estimated_price || parseFloat(price),
              city,
              state: 'Karnataka',
              image_url: photo || 'https://images.unsplash.com/photo-1590069261209-f8e9b8642343?w=800&auto=format&fit=crop&q=60'
            }
          });
          setDone(true);
        } catch (e) {
          alert('Publish failed: ' + e.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-2xl mx-auto px-4 py-8 fade-in">
          <div className="bg-white rounded-3xl border border-gray-200 p-8 shadow-sm space-y-6">
            <h2 className="text-xl font-bold text-gray-900">Sell Surplus Material (AI 9-Step Wizard)</h2>

            {done ? (
              <div className="text-center py-8 space-y-3">
                <div className="text-4xl text-emerald-600">✓</div>
                <h3 className="text-xl font-bold text-gray-900">Listing Published to Marketplace!</h3>
                <p className="text-xs text-gray-500">Contractors and buyers can now discover your material and submit offers.</p>
                <button onClick={() => onNavigate('marketplace')} className="px-6 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">View in Marketplace</button>
              </div>
            ) : (
              <>
                {step === 1 && (
                  <div className="space-y-4 text-center">
                    <p className="text-xs text-gray-500">Capture a photo with your device camera or upload an image file to trigger computer vision analysis.</p>
                    <div className="grid grid-cols-2 gap-4">
                      <button onClick={() => setCameraOpen(true)} className="p-6 border-2 border-emerald-500 bg-emerald-50/50 rounded-2xl text-xs font-bold text-emerald-800">
                        📷 Open Device Camera
                      </button>
                      <label className="p-6 border-2 border-gray-200 rounded-2xl text-xs font-bold text-gray-700 hover:bg-gray-50 cursor-pointer flex flex-col items-center justify-center">
                        📁 Upload Photo File
                        <input type="file" accept="image/*" onChange={(e) => {
                          const f = e.target.files[0];
                          if (f) {
                            const r = new FileReader();
                            r.onload = ev => handlePhoto(ev.target.result);
                            r.readAsDataURL(f);
                          }
                        }} className="hidden" />
                      </label>
                    </div>
                  </div>
                )}

                {step === 2 && (
                  <div className="space-y-4">
                    {loading ? (
                      <p className="text-center py-8 text-xs text-emerald-700 font-semibold">Analyzing image with MobileNetV2...</p>
                    ) : (
                      <>
                        <div className="flex gap-4 items-center">
                          {photo && <img src={photo} className="w-24 h-24 object-cover rounded-xl border" />}
                          <div>
                            <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">{(aiData?.confidence * 100).toFixed(1)}% AI Confidence</span>
                            <h3 className="text-lg font-bold text-gray-900 mt-1">{aiData?.predicted_material}</h3>
                            <p className="text-xs text-gray-500">Category: {aiData?.category}</p>
                          </div>
                        </div>

                        <div>
                          <label className="text-xs font-semibold text-gray-700 block mb-1">Confirm or Correct Material:</label>
                          <input type="text" value={selectedMat} onChange={(e) => setSelectedMat(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs" />
                        </div>

                        <button onClick={() => setStep(3)} className="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">Proceed to Quality & Pricing →</button>
                      </>
                    )}
                  </div>
                )}

                {step === 3 && (
                  <div className="space-y-4">
                    <div className="p-4 bg-gray-50 rounded-2xl text-xs space-y-2">
                      <p className="font-bold text-gray-800">AI Quality Assessment: Grade {qData?.quality_grade} ({qData?.quality_score}/100)</p>
                      <p className="text-gray-500">{qData?.condition_description}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-semibold text-gray-600 block">Quantity</label>
                        <input type="number" value={qty} onChange={(e) => setQty(e.target.value)} className="w-full px-3 py-1.5 border rounded-lg text-xs" />
                      </div>
                      <div>
                        <label className="text-[11px] font-semibold text-gray-600 block">Unit</label>
                        <select value={unit} onChange={(e) => setUnit(e.target.value)} className="w-full px-3 py-1.5 border rounded-lg text-xs bg-white">
                          <option value="Pieces">Pieces</option>
                          <option value="Tonnes">Tonnes</option>
                          <option value="Sq.Ft">Sq.Ft</option>
                          <option value="Meters">Meters</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-gray-600 block">Your Selling Price (₹)</label>
                      <input type="number" value={price} onChange={(e) => setPrice(e.target.value)} className="w-full px-3 py-2 border-2 border-emerald-500 rounded-xl text-base font-bold text-emerald-900" />
                      <span className="text-[10px] text-gray-500">AI Estimated Fair Value: ₹{valData?.estimated_price?.toLocaleString()}</span>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-gray-600 block">Location City</label>
                      <input type="text" value={city} onChange={(e) => setCity(e.target.value)} className="w-full px-3 py-1.5 border rounded-lg text-xs" />
                    </div>

                    <div className="flex justify-between pt-2">
                      <button onClick={() => setStep(2)} className="px-4 py-2 border rounded-xl text-xs">Back</button>
                      <button onClick={handlePublish} disabled={loading} className="px-6 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold shadow-md">
                        {loading ? 'Publishing...' : 'Publish Listing'}
                      </button>
                    </div>
                  </div>
                )}
              </>
            )}
          </div>

          <CameraModal isOpen={cameraOpen} onClose={() => setCameraOpen(false)} onCapture={handlePhoto} />
        </div>
      );
    }

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await API.req('/api/auth/login', { method: 'POST', body: { email, password } });
          API.setToken(res.access_token);
          onLogin(res.user);
          onNavigate('marketplace');
        } catch (err) {
          alert('Login failed: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      const fill = (e, p) => { setEmail(e); setPassword(p); };

      return (
        <div className="max-w-sm mx-auto px-4 py-16 fade-in">
          <div className="bg-white rounded-3xl border p-8 shadow-lg space-y-4">
            <h2 className="text-xl font-bold text-gray-900 text-center">Sign In to REBUILD AI</h2>
            <form onSubmit={handleLogin} className="space-y-3 text-xs">
              <input type="email" placeholder="Email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
              <input type="password" placeholder="Password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
              <button type="submit" disabled={loading} className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm">
                {loading ? 'Authenticating...' : 'Sign In'}
              </button>
            </form>

            <div className="pt-4 border-t text-[11px] text-center space-y-1">
              <p className="text-gray-400 uppercase font-bold">Local Demo Accounts</p>
              <div className="flex justify-center gap-2">
                <button onClick={() => fill('seller@demolitioncorp.com', 'Seller@1234')} className="px-2 py-1 border rounded hover:bg-gray-50">Seller</button>
                <button onClick={() => fill('buyer@greenbuild.in', 'Buyer@1234')} className="px-2 py-1 border rounded hover:bg-gray-50">Buyer</button>
                <button onClick={() => fill('admin@rebuildai.com', 'Admin@1234')} className="px-2 py-1 border rounded hover:bg-gray-50">Admin</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function RegisterView({ onNavigate, onLogin }) {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [userType, setUserType] = useState('BOTH');

      const handleReg = async (e) => {
        e.preventDefault();
        try {
          const res = await API.req('/api/auth/register', {
            method: 'POST',
            body: { name, email, password, user_type: userType, city: 'Bangalore', state: 'Karnataka' }
          });
          API.setToken(res.access_token);
          onLogin(res.user);
          onNavigate('marketplace');
        } catch (err) {
          alert('Registration error: ' + err.message);
        }
      };

      return (
        <div className="max-w-sm mx-auto px-4 py-16 fade-in">
          <div className="bg-white rounded-3xl border p-8 shadow-lg space-y-4">
            <h2 className="text-xl font-bold text-gray-900 text-center">Create Account</h2>
            <form onSubmit={handleReg} className="space-y-3 text-xs">
              <input type="text" placeholder="Full / Company Name" required value={name} onChange={e => setName(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
              <input type="email" placeholder="Email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
              <input type="password" placeholder="Password (min 6 chars)" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
              <select value={userType} onChange={e => setUserType(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm bg-white">
                <option value="BOTH">Both (Buyer & Seller)</option>
                <option value="SELLER">Demolition Contractor (Seller)</option>
                <option value="BUYER">Builder / Architect (Buyer)</option>
              </select>
              <button type="submit" className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm">
                Register
              </button>
            </form>
          </div>
        </div>
      );
    }

    // Render root React component
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
